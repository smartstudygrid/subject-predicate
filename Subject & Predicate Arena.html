<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subject &amp; Predicate Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0720;--c:#00f0ff;--m:#ff2bd6;--g:#b6ff3b;--y:#ffe14d;--t:#eaf6ff;--r:#ff4d6d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:"Trebuchet MS",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,#3b0f6e,transparent 60%),linear-gradient(#0a0720,#05030f)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#00f0ff14 1px,transparent 1px),linear-gradient(90deg,#00f0ff14 1px,transparent 1px);background-size:38px 38px}
.scr{position:relative;height:100dvh;max-width:920px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1.3vh}
.scr[hidden]{display:none}
h1,h2,.hud,.tag,.nb{font-family:Orbitron,"Trebuchet MS",sans-serif}
.center{justify-content:center;align-items:center;text-align:center;gap:2.2vh}
h1{font-size:clamp(26px,min(7vh,8vw),64px);line-height:1.1;color:var(--c);text-shadow:0 0 10px var(--c),0 0 30px var(--c),0 0 60px #0070ff}
h1 span{color:var(--m);text-shadow:0 0 10px var(--m),0 0 30px var(--m)}
.sub{font-size:clamp(16px,3.2vh,26px);color:#bcd7ff;max-width:560px;line-height:1.5}
.sub b{color:var(--y)}
input{font:inherit;font-size:clamp(18px,3.2vh,26px);padding:10px 16px;width:min(360px,90%);text-align:center;color:var(--t);background:#120a33;border:2px solid var(--c);border-radius:12px;outline:none;box-shadow:0 0 14px #00f0ff55}
.go{font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(18px,3.5vh,28px);padding:12px 34px;border:0;border-radius:14px;cursor:pointer;color:#0a0720;background:linear-gradient(90deg,var(--c),var(--g));box-shadow:0 0 22px #00f0ffaa;transition:transform .15s}
.go:hover{transform:scale(1.06)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:clamp(15px,2.9vh,23px);flex-wrap:wrap}
.hud div{padding:6px 12px;border:1px solid var(--c);border-radius:10px;background:#0d0a2acc;box-shadow:0 0 10px #00f0ff44;white-space:nowrap}
.hud .sc{color:var(--y);border-color:var(--y);box-shadow:0 0 10px #ffe14d55}
.hud .fi{cursor:pointer;color:var(--m);border-color:var(--m);box-shadow:0 0 10px #ff2bd655;font:inherit}
.fi:disabled{opacity:.35;cursor:default}
.bar{height:10px;border-radius:6px;background:#1a1240;overflow:hidden;flex:none}
#bar{height:100%;width:100%;background:linear-gradient(90deg,var(--g),var(--c));box-shadow:0 0 12px var(--c);transition:width .1s linear}
#bar.low{background:linear-gradient(90deg,var(--r),var(--m))}
.tag{font-size:clamp(13px,2.5vh,20px);letter-spacing:.08em;color:var(--g)}
.card{flex:none;padding:clamp(10px,2vh,22px);border:2px solid var(--m);border-radius:16px;background:#150a38dd;box-shadow:0 0 20px #ff2bd655,inset 0 0 20px #ff2bd622;text-align:center}
.boss .card{border-color:var(--y);box-shadow:0 0 26px #ffe14d77,inset 0 0 20px #ffe14d22}
.boss .tag{color:var(--y)}
#ask{font-size:clamp(16px,3vh,26px);color:var(--c);font-weight:bold}
#sen{margin-top:1vh;font-size:clamp(22px,min(5vh,6.2vw),46px);line-height:1.3;color:#fff;text-shadow:0 0 12px #ffffff66}
#opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:clamp(6px,1.4vh,14px)}
#opts button{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-size:clamp(18px,min(3.7vh,5vw),32px);line-height:1.25;color:var(--t);padding:6px 12px;background:#0e0a2ccc;border:2px solid #3d6bff;border-radius:14px;cursor:pointer;transition:.15s;min-height:0}
#opts button:hover:not(.lock){border-color:var(--c);box-shadow:0 0 16px var(--c);transform:translateY(-2px)}
#opts b{flex:none;display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:8px;background:var(--c);color:#0a0720;font-family:Orbitron,sans-serif;font-size:.8em}
#opts .lock{pointer-events:none}
#opts .ok{border-color:var(--g);background:#14380f;box-shadow:0 0 20px var(--g)}
#opts .bad{border-color:var(--r);background:#40101e;box-shadow:0 0 20px var(--r);animation:sh .35s}
#opts .gone{visibility:hidden}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foot{flex:none;display:flex;align-items:center;gap:12px;min-height:clamp(78px,14vh,124px)}
#fb{flex:1;font-size:clamp(15px,3vh,24px);line-height:1.35;color:#d8e8ff}
#pts{display:block;font-family:Orbitron,sans-serif;color:var(--g);font-size:.95em;margin-bottom:2px}
#pts.x{color:var(--r)}
.nb{flex:none;visibility:hidden}
.big{font-family:Orbitron,sans-serif;font-size:clamp(34px,9vh,80px);color:var(--y);text-shadow:0 0 16px var(--y),0 0 40px #ff9d00}
.rank{font-family:Orbitron,sans-serif;font-size:clamp(20px,4.4vh,38px);color:var(--m);text-shadow:0 0 14px var(--m)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{padding:8px 16px;border:1px solid var(--c);border-radius:12px;font-size:clamp(15px,3vh,24px);box-shadow:0 0 10px #00f0ff44}
@media(max-width:600px){#opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="start" class="scr center">
  <h1>SUBJECT <span>&amp;</span> PREDICATE<br>ARENA</h1>
  <p class="sub">25 levels. <b>+100</b> per correct answer, plus up to <b>+50 streak bonus</b>. The final <b>BOSS ROUND scores ×2</b>. Get all 25 right for a <b>+500 PERFECT bonus</b>. You have two <b>50/50</b> power-ups.</p>
  <input id="nm" maxlength="24" placeholder="Enter your player name" autocomplete="off">
  <button class="go" id="gob">▶ START GAME</button>
  <p class="sub" style="font-size:clamp(14px,2.5vh,19px)">Tip: press keys 1–4 to answer, Enter for next.</p>
</section>

<section id="game" class="scr" hidden>
  <div class="hud">
    <div class="sc">⭐ <span id="sc">0</span></div>
    <div id="st">🔥 ×0</div>
    
    <button class="fi" id="fi">⚡ 50/50 ×2</button>
  </div>
  
  <div class="tag" id="lvl"></div>
  <div class="card"><div id="ask"></div><div id="sen"></div></div>
  <div id="opts"></div>
  <div class="foot">
    <div id="fb"><span id="pts"></span><span id="why"></span></div>
    <button class="go nb" id="nx">NEXT ▶</button>
  </div>
</section>

<section id="end" class="scr center" hidden>
  <h2 class="sub" id="who"></h2>
  <div class="big" id="fin">0</div>
  <div class="rank" id="rk"></div>
  <div class="stats" id="stt"></div>
  <p class="sub" id="msg"></p>
  <button class="go" id="again">↻ PLAY AGAIN</button>
</section>

<script>
const P=["SIMPLE SUBJECT","COMPLETE SUBJECT","SIMPLE PREDICATE","COMPLETE PREDICATE","BOSS ROUND · ×2 POINTS"];
const A=["Find the SIMPLE SUBJECT","Find the COMPLETE SUBJECT","Find the SIMPLE PREDICATE","Find the COMPLETE PREDICATE","Choose the best answer"];
// [sentence, options, correctIndex, explanation, optional custom question]
const Q=[
["The tall boy in the red jacket won the race.",["tall","boy","jacket","race"],1,"“boy” is the main noun. “jacket” sits inside the phrase “in the red jacket”."],
["Several students from our school joined the science fair.",["Several","school","students","fair"],2,"“school” follows “from”, so it can’t be the subject."],
["After the long match, the exhausted players rested.",["players","match","exhausted","rested"],0,"Skip the opening phrase. Who rested? The players."],
["My younger sister’s best friend plays the violin.",["sister","friend","sister’s","violin"],1,"The friend plays. “sister’s” only shows whose friend."],
["She quickly finished her homework before dinner.",["quickly","homework","She","dinner"],2,"A pronoun can be the simple subject."],
["The old wooden bridge over the river collapsed during the storm.",["The old wooden bridge","The old wooden bridge over the river","The old wooden bridge over the river collapsed","bridge over the river"],1,"“over the river” describes the bridge. The verb “collapsed” starts the predicate."],
["Our school’s new library opens at eight o’clock.",["Our school’s new library opens","library","New library","Our school’s new library"],3,"Everything before the verb “opens” belongs to the subject."],
["The girl with the long braid and the blue backpack waved to us.",["The girl","The girl with the long braid","The girl with the long braid and the blue backpack","waved to us"],2,"Both phrases describe the girl. Stop just before “waved”."],
["Every student in Grade 9 must read the notice.",["Every student","Grade 9","Every student in Grade 9 must read","Every student in Grade 9"],3,"“in Grade 9” tells which students. “must read” begins the predicate."],
["Dark clouds gathered over the hills.",["Dark | clouds gathered over the hills","Dark clouds | gathered over the hills","Dark clouds gathered | over the hills","Dark clouds gathered over | the hills"],1,"Subject: “Dark clouds”. Predicate: “gathered over the hills”.","Split it: complete subject | complete predicate"],
["The children laughed happily at the clown.",["happily","laughed","clown","laughed happily"],1,"“laughed” is the verb. “happily” is an adverb."],
["The students had been waiting for the bus since seven.",["waiting","had been","had been waiting","had been waiting for the bus"],2,"Main verb plus helping verbs: “had been waiting”.","Find the SIMPLE PREDICATE (whole verb phrase)"],
["Our team will not play tomorrow.",["will not play","will play","play","will"],1,"“not” is an adverb, so it is left out: “will play”."],
["Mr. Hassan, our English teacher, graded the essays overnight.",["teacher","essays","overnight","graded"],3,"“graded” is the action verb."],
["The soup smells delicious.",["smells","delicious","soup","smells delicious"],0,"“smells” is a linking verb. “delicious” describes the soup."],
["The new student answered the question confidently.",["answered","answered the question","answered the question confidently","The new student answered"],2,"The verb plus everything after it."],
["My grandfather tells wonderful stories about his village.",["tells","tells wonderful stories","My grandfather tells wonderful stories","tells wonderful stories about his village"],3,"“about his village” adds detail, so it is in the predicate."],
["The museum, which opened last year, attracts thousands of visitors.",["which opened last year","attracts thousands of visitors","opened last year, attracts thousands of visitors","The museum attracts"],1,"“which opened last year” describes the museum, so it belongs to the subject."],
["",["The tired runners","the finish line","Slowly the runners","crossed the finish line slowly"],3,"Only this group has a verb and says what someone did.","Which could be a COMPLETE PREDICATE?"],
["The lights flickered.",["Complete subject = “lights”","Simple subject = “lights”","Simple predicate = “flickered”","Complete predicate = “flickered”"],0,"The complete subject is “The lights”.","Which statement is NOT true?"],
["",["The boy painted and repaired the fence.","After lunch, the boy painted the fence.","Ali and Omar painted the fence.","The boy painted the fence quickly."],2,"Two subjects joined by “and”. The first sentence has a compound predicate.","Which sentence has a COMPOUND SUBJECT?"],
["",["Sara and Layla sang loudly.","The singer smiled and waved at the crowd.","The singer smiled, and the crowd cheered.","The singer smiled at the crowd."],1,"One subject, two verbs joined by “and”: smiled and waved.","Which sentence has a COMPOUND PREDICATE?"],
["Close the window, please.",["window","please","(You) – understood","Close"],2,"In a command the subject “you” is hidden: (You) close the window.","What is the subject of this command?"],
["Across the field ran a frightened rabbit.",["rabbit","field","ran","frightened"],0,"Reorder it: A frightened rabbit ran across the field.","Find the SIMPLE SUBJECT"],
["Where did the children hide the treasure?",["Where","treasure","hide","children"],3,"Turn it into a statement: The children did hide the treasure.","Find the SIMPLE SUBJECT"]
];
const $=s=>document.querySelector(s);
let i,score,streak,best,right,fifty,tl,timer,locked,cur,name="";
const show=id=>document.querySelectorAll(".scr").forEach(e=>e.hidden=e.id!=id);
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function beep(f,d=.12){try{const c=beep.c||(beep.c=new AudioContext()),o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function hud(){$("#sc").textContent=score;$("#st").textContent="🔥 ×"+streak;$("#fi").textContent="⚡ 50/50 ×"+fifty;$("#fi").disabled=fifty<1||locked}
function start(){name=$("#nm").value.trim();score=streak=best=right=0;fifty=2;i=0;show("game");load()}
function load(){
  const q=Q[i],p=i/5|0;locked=false;
  cur=shuffle(q[1].map((t,k)=>({t,ok:k==q[2]})));
  $("#game").classList.toggle("boss",p==4);
  $("#lvl").textContent="LEVEL "+(i+1)+" / 25 · "+P[p];
  $("#ask").textContent=q[4]||A[p];
  $("#sen").textContent=q[0];$("#sen").hidden=!q[0];
  const o=$("#opts");o.innerHTML="";
  cur.forEach((x,k)=>{const b=document.createElement("button");b.innerHTML="<b>"+(k+1)+"</b><span></span>";b.lastChild.textContent=x.t;b.onclick=()=>pick(k);o.append(b)});
  $("#pts").textContent="";$("#why").textContent="Take your time and build a streak for bonus points!";
  $("#nx").style.visibility="hidden";
  
  
  hud();
}
function pick(k){
  if(locked||(k>=0&&$("#opts").children[k].classList.contains("gone")))return;
  locked=true;
  const bs=[...$("#opts").children],ok=k>=0&&cur[k].ok,m=i>=20?2:1;
  bs.forEach((b,j)=>{b.classList.add("lock");if(cur[j].ok)b.classList.add("ok")});
  const pt=$("#pts");pt.className="";
  if(ok){streak++;best=Math.max(best,streak);right++;
    const sb=Math.min(streak,5)*10,s=(100+sb)*m;score+=s;
    pt.textContent="✅ +"+s+" pts  (streak +"+sb+(m>1?" · BOSS ×2":"")+")";beep(880)}
  else{if(k>=0)bs[k].classList.add("bad");streak=0;pt.className="x";pt.textContent="❌ Not this time. Streak lost.";beep(180,.3)}
  $("#why").textContent=Q[i][3];
  const n=$("#nx");n.textContent=i==24?"RESULTS ▶":"NEXT ▶";n.style.visibility="visible";hud();
}
function half(){
  if(locked||fifty<1)return;fifty--;
  const bs=$("#opts").children;
  shuffle([...cur.keys()].filter(k=>!cur[k].ok)).slice(0,2).forEach(k=>bs[k].classList.add("gone"));hud();
}
function nextQ(){i++;i>=25?end():load()}
function end(){
  const perfect=right==25;if(perfect)score+=500;
  const pc=Math.round(right/25*100);
  const r=right>=23?["👑 LEGEND","Outstanding! You have mastered subjects and predicates."]:right>=19?["🥇 GOLD","Great work! Just a few tricky ones to review."]:right>=14?["🥈 SILVER","Good effort! Review the ones you missed and try again."]:["🎮 ROOKIE","Keep training. Replay to climb the ranks!"];
  $("#who").textContent=name?"PLAYER: "+name.toUpperCase():"GAME OVER";
  $("#fin").textContent=score+" PTS";$("#rk").textContent=r[0];
  $("#stt").innerHTML="<div>✅ "+right+" / 25 ("+pc+"%)</div><div>🔥 Best streak ×"+best+"</div>"+(perfect?"<div>💎 +500 PERFECT</div>":"");
  $("#msg").textContent=r[1]+" Take a screenshot and show your teacher!";
  show("end");beep(660,.3);
}
$("#gob").onclick=start;$("#again").onclick=start;$("#nx").onclick=nextQ;$("#fi").onclick=half;
$("#nm").onkeydown=e=>{if(e.key=="Enter")start()};
document.onkeydown=e=>{
  if($("#game").hidden)return;
  if("1234".includes(e.key)&&e.key)pick(+e.key-1);
  else if((e.key=="Enter"||e.key==" ")&&locked){e.preventDefault();nextQ()}
};
</script>
</body>
</html>
